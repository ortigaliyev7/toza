# Toza Android ilovasi (Google Play uchun .aab). Qo'lda: Actions → «Android ilova» → Run workflow.
# Imzo (ixtiyoriy, Play'ga yuklash uchun kerak) — Settings → Secrets and variables → Actions:
#   Secrets:   TOZA_KEYSTORE_BASE64 (yuklash kaliti .jks, base64), TOZA_KEYSTORE_PASSWORD, TOZA_KEY_ALIAS, TOZA_KEY_PASSWORD
#   Variables: TOZA_HOST (masalan toza-production.up.railway.app, https:// siz)
name: Android ilova

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versiya nomi (masalan 1.0.1)"
        required: false
        default: "1.0.0"
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Imzo kaliti
        env:
          KS: ${{ secrets.TOZA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "TOZA_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::Imzo kaliti yo'q: imzosiz .aab yig'iladi (Play'ga yuklab bo'lmaydi, faqat tekshiruv uchun)"
          fi
      - name: Yig'ish (.aab va .apk)
        env:
          TOZA_HOST: ${{ vars.TOZA_HOST }}
          TOZA_VERSION_CODE: ${{ github.run_number }}
          TOZA_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
          TOZA_KEYSTORE_PASSWORD: ${{ secrets.TOZA_KEYSTORE_PASSWORD }}
          TOZA_KEY_ALIAS: ${{ secrets.TOZA_KEY_ALIAS }}
          TOZA_KEY_PASSWORD: ${{ secrets.TOZA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
      - name: Kalit barmoq izi (assetlinks uchun)
        if: env.TOZA_KEYSTORE_FILE != ''
        env:
          TOZA_KEYSTORE_PASSWORD: ${{ secrets.TOZA_KEYSTORE_PASSWORD }}
          TOZA_KEY_ALIAS: ${{ secrets.TOZA_KEY_ALIAS }}
        run: keytool -list -v -keystore "$TOZA_KEYSTORE_FILE" -storepass "$TOZA_KEYSTORE_PASSWORD" -alias "$TOZA_KEY_ALIAS" | grep -i "SHA256:"
      - uses: actions/upload-artifact@v4
        with:
          name: toza-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
