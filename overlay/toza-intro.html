<script>
(function () {
  var D = {
    uz: {sub: "Telegram akkauntingizni brauzerda ochadi. Premium shart emas.", b1: "Telegram'ning rasmiy protokoli (MTProto) orqali ulanadi.", b2: "Raqamingiz va kod faqat Telegram'ga yuboriladi, Sharpa serveriga emas.", b3: "Sessiya faqat shu brauzerda saqlanadi. Telegram → Sozlamalar → Qurilmalar orqali istalgan payt uzishingiz mumkin.", warn: "Telegram kodini hech kimga aytmang. Toza uni faqat shu sahifaning o'zida so'raydi.", go: "Tushundim, davom etish", rt: "Sahifa to'liq yuklanmadi (internet sekin bo'lishi mumkin).", rl: "Qayta yuklash"},
    ru: {sub: "Открывает ваш аккаунт Telegram в браузере. Premium не нужен.", b1: "Подключение по официальному протоколу Telegram (MTProto).", b2: "Номер и код отправляются только в Telegram, не на сервер Sharpa.", b3: "Сессия хранится только в этом браузере. Отключить можно в любой момент: Telegram → Настройки → Устройства.", warn: "Никому не сообщайте код Telegram. Toza запрашивает его только на этой странице.", go: "Понятно, продолжить", rt: "Страница загрузилась не полностью (возможно, медленный интернет).", rl: "Перезагрузить"},
    en: {sub: "Opens your Telegram account in the browser. No Premium needed.", b1: "Connects through Telegram's official protocol (MTProto).", b2: "Your number and code go only to Telegram, never to the Sharpa server.", b3: "The session stays in this browser only. You can end it any time in Telegram → Settings → Devices.", warn: "Never tell anyone your Telegram code. Toza asks for it only on this page.", go: "Got it, continue", rt: "The page did not load completely (the connection may be slow).", rl: "Reload"}
  };
  var lang = String(navigator.language || 'uz').slice(0, 2);
  var T = D[lang] || D.uz;
  var intro = document.getElementById('toza-intro'), retry = document.getElementById('toza-retry');
  [intro, retry].forEach(function (box) { Array.prototype.forEach.call(box.querySelectorAll('[data-k]'), function (el) { el.textContent = T[el.getAttribute('data-k')]; }); });
  var KEY = 'toza_intro_ok', seen = false;
  try { seen = localStorage.getItem(KEY) === '1'; } catch (e) { /* xotira yopiq */ }
  // Sharpa ichida (iframe) ochilganda tushuntirish ko'rsatilmaydi: foydalanuvchi Sharpa'dan o'zi kelgan, kirish darrov boshlanadi.
  var embedded = false; try { embedded = window.parent !== window; } catch (e) { embedded = true; }
  if (seen || embedded) intro.parentNode.removeChild(intro); else intro.style.display = 'flex';
  var go = document.getElementById('toza-go');
  if (go) go.onclick = function () { try { localStorage.setItem(KEY, '1'); } catch (e) { /* xotira yopiq */ } if (intro.parentNode) intro.parentNode.removeChild(intro); };
  document.getElementById('toza-reload').onclick = function () { location.reload(); };
  // Asosiy CSS yuklanmagan bo'lsa (sekin tarmoq) uslubsiz sahifa o'rniga «Qayta yuklash»: avval bir marta o'zi urinadi.
  // Asosiy CSS yuklanganini asosiy fayldagi `.btn-primary` qoidasi bo'yicha tekshiramiz (inline shrift bunga xalaqit bermaydi).
  var probe = document.createElement('button');
  probe.className = 'btn-primary'; probe.setAttribute('aria-hidden', 'true'); probe.style.cssText = 'position:fixed;left:-9999px;top:0;visibility:hidden';
  document.body.appendChild(probe);
  function cssOk() { return getComputedStyle(probe).borderRadius !== '0px'; }
  var n = 0, t = setInterval(function () {
    n++;
    if (cssOk()) { clearInterval(t); retry.style.display = 'none'; return; }
    if (n >= 10) {
      var did = false; try { did = sessionStorage.getItem('toza_reload') === '1'; sessionStorage.setItem('toza_reload', '1'); } catch (e) { did = true; }
      if (!did) location.reload(); else retry.style.display = 'flex';
      if (did) clearInterval(t);
    }
  }, 1000);
}());
</script>
